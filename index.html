
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769e0">
<title>PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #172033;
}

header {
  background: #1769e0;
  color: white;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  font-size: 20px;
  margin: 0;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  background: #1769e0;
  color: white;
}

.secondary {
  background: white;
  color: #1769e0;
  border: 1px solid #dce3ed;
}

.danger {
  background: #ffe8e8;
  color: #c62828;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#welcome {
  text-align: center;
  background: white;
  padding: 40px 20px;
  border-radius: 18px;
  margin-top: 35px;
}

#welcome .symbol {
  font-size: 60px;
}

#welcome p {
  color: #687386;
  line-height: 1.5;
}

#editor {
  display: none;
}

.file-info {
  background: white;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
  overflow-wrap: anywhere;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.toolbar button {
  flex: 1;
  min-width: 95px;
}

.viewer {
  background: #dce2eb;
  border-radius: 14px;
  min-height: 300px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
}

canvas {
  display: block;
  max-width: 100%;
  height: auto;
  background: white;
  box-shadow: 0 3px 15px #0002;
}

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin: 16px 0;
}

.navigation span {
  font-weight: bold;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

#status {
  color: #657084;
  font-size: 13px;
  text-align: center;
  margin-top: 18px;
  min-height: 20px;
}

#fileInput {
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8992a1;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>📄 PDF Editor</h1>
  <button class="secondary" id="openBtn">Abrir PDF</button>
</header>

<main>

<section id="welcome">
  <div class="symbol">📑</div>
  <h2>Seu PDF, do seu jeito.</h2>
  <p>Visualize, organize e edite seus documentos facilmente.</p>
  <button class="primary" id="welcomeOpen">
    Escolher arquivo PDF
  </button>
</section>

<section id="editor">

  <div class="file-info">
    <strong id="fileName">Documento.pdf</strong>
    <div id="fileDetails"></div>
  </div>

  <div class="toolbar">
    <button class="secondary" id="zoomOut">− Zoom</button>
    <button class="secondary" id="zoomIn">+ Zoom</button>
    <button class="secondary" id="rotateBtn">↻ Girar</button>
  </div>

  <div class="viewer">
    <canvas id="pdfCanvas"></canvas>
  </div>

  <div class="navigation">
    <button class="secondary" id="prevBtn">← Anterior</button>
    <span id="pageLabel">1 / 1</span>
    <button class="secondary" id="nextBtn">Próxima →</button>
  </div>

  <div class="actions">
    <button class="danger" id="deleteBtn">
      🗑️ Excluir esta página
    </button>
    <button class="secondary" id="undoBtn" disabled>
      ↶ Desfazer
    </button>
    <button class="primary" id="saveBtn" style="grid-column:1/-1">
      💾 Salvar PDF
    </button>
  </div>

</section>

<div id="status">Pronto para abrir um documento.</div>

</main>

<footer>
  PDF Editor · Simples e fácil de usar
</footer>

<input type="file" id="fileInput" accept=".pdf,application/pdf">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);

const fileInput = $("fileInput");
const canvas = $("pdfCanvas");
const ctx = canvas.getContext("2d");

let originalBytes = null;
let pdfDoc = null;
let fileName = "documento.pdf";

let pages = [];
let deletedPages = [];
let rotations = {};

let currentPage = 0;
let zoom = 1;
let rendering = false;

function status(message) {
  $("status").textContent = message;
}

$("openBtn").onclick = () => fileInput.click();
$("welcomeOpen").onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  fileInput.value = "";

  if (!file) return;

  if (file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")) {
    status("Escolha um arquivo PDF válido.");
    return;
  }

  try {
    status("Abrindo documento...");

    originalBytes = new Uint8Array(await file.arrayBuffer());
    pdfDoc = await pdfjsLib.getDocument({
      data: originalBytes.slice()
    }).promise;

    fileName = file.name;

    pages = Array.from(
      { length: pdfDoc.numPages },
      (_, i) => i + 1
    );

    deletedPages = [];
    rotations = {};
    currentPage = 0;
    zoom = 1;

    $("fileName").textContent = fileName;
    $("fileDetails").textContent =
      pdfDoc.numPages + " páginas";

    $("welcome").style.display = "none";
    $("editor").style.display = "block";

    await renderPage();
    status("Documento aberto com sucesso!");

  } catch (error) {
    status("Erro ao abrir PDF: " + error.message);
  }
};

async function renderPage() {
  if (!pdfDoc || rendering || pages.length === 0) return;

  rendering = true;

  try {
    currentPage = Math.max(
      0,
      Math.min(currentPage, pages.length - 1)
    );

    const originalNumber = pages[currentPage];
    const page = await pdfDoc.getPage(originalNumber);

    const rotation = (
      page.rotate + (rotations[originalNumber] || 0)
    ) % 360;

    const baseViewport = page.getViewport({
      scale: 1,
      rotation
    });

    const availableWidth = Math.max(
      250,
      $("editor").clientWidth - 35
    );

    const scale = Math.min(
      1.7,
      availableWidth / baseViewport.width
    ) * zoom;

    const viewport = page.getViewport({
      scale,
      rotation
    });

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({
      canvasContext: ctx,
      viewport
    }).promise;

    $("pageLabel").textContent =
      (currentPage + 1) + " / " + pages.length;

    $("fileDetails").textContent =
      pages.length + " páginas";

    $("prevBtn").disabled = currentPage === 0;
    $("nextBtn").disabled =
      currentPage >= pages.length - 1;

    $("undoBtn").disabled = deletedPages.length === 0;

  } catch (error) {
    status("Erro ao visualizar página.");
  } finally {
    rendering = false;
  }
}

$("prevBtn").onclick = async () => {
  if (currentPage > 0) {
    currentPage--;
    await renderPage();
  }
};

$("nextBtn").onclick = async () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    await renderPage();
  }
};

$("zoomIn").onclick = async () => {
  zoom = Math.min(2.5, zoom + 0.2);
  await renderPage();
};

$("zoomOut").onclick = async () => {
  zoom = Math.max(0.5, zoom - 0.2);
  await renderPage();
};

$("rotateBtn").onclick = async () => {
  if (!pages.length) return;

  const number = pages[currentPage];

  rotations[number] =
    ((rotations[number] || 0) + 90) % 360;

  await renderPage();
  status("Rotação aplicada.");
};

$("deleteBtn").onclick = async () => {
  if (pages.length <= 1) {
    status("O PDF precisa ter pelo menos uma página.");
    return;
  }

  const confirmed = confirm(
    "Deseja realmente excluir esta página?"
  );

  if (!confirmed) return;

  const removed = pages.splice(currentPage, 1)[0];

  deletedPages.push({
    number: removed,
    position: currentPage
  });

  if (currentPage >= pages.length) {
    currentPage = pages.length - 1;
  }

  await renderPage();
  status("Página excluída. Você pode desfazer.");
};

$("undoBtn").onclick = async () => {
  if (!deletedPages.length) return;

  const last = deletedPages.pop();

  pages.splice(last.position, 0, last.number);
  currentPage = last.position;

  await renderPage();
  status("Exclusão desfeita.");
};

$("saveBtn").onclick = async () => {
  if (!originalBytes || !pages.length) return;

  try {
    status("Preparando documento...");

    const { PDFDocument, degrees } = PDFLib;

    const output = await PDFDocument.load(originalBytes);

    const keep = new Set(pages);

    for (let i = output.getPageCount() - 1; i >= 0; i--) {
      if (!keep.has(i + 1)) {
        output.removePage(i);
      }
    }

    const outputPages = output.getPages();

    pages.forEach((number, index) => {
      const rotation = rotations[number] || 0;

      if (rotation) {
        const page = outputPages[index];

        page.setRotation(
          degrees(
            (page.getRotation().angle + rotation) % 360
          )
        );
      }
    });

    const bytes = await output.save();

    const blob = new Blob([bytes], {
      type: "application/pdf"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download =
      fileName.replace(/\.pdf$/i, "") + "-editado.pdf";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);

    status("PDF salvo com sucesso!");

  } catch (error) {
    status("Erro ao salvar: " + error.message);
  }
};
</script>

</body>
</html>
