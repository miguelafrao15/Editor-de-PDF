<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>PDF Editor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">▤</span><div><strong>PDF Editor</strong><small>Seu documento, do seu jeito</small></div></div>
    <button id="openBtn" class="primary">Abrir PDF</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  </header>

  <main>
    <section id="welcome" class="welcome">
      <div class="hero-icon">PDF</div>
      <h1>Seu PDF em um só lugar.</h1>
      <p>Abra um documento para visualizar e organizar suas páginas.</p>
      <button id="welcomeOpen" class="primary large">Selecionar PDF</button>
      <p class="hint">Você também poderá receber PDFs pelo menu Compartilhar quando instalar o app.</p>
    </section>

    <section id="editor" class="editor" hidden>
      <div class="docbar">
        <div class="docname"><span>▤</span><strong id="fileName">Documento.pdf</strong></div>
        <button id="downloadBtn" class="primary">Salvar PDF</button>
      </div>
      <div class="toolbar">
        <button id="prevBtn" title="Página anterior">‹</button>
        <span>Página <b id="pageNum">1</b> de <b id="pageCount">1</b></span>
        <button id="nextBtn" title="Próxima página">›</button>
        <span class="tool-separator"></span>
        <button id="zoomOut" title="Diminuir">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Ampliar">+</button>
        <button id="rotateBtn" title="Girar página">↻</button>
      </div>
      <div class="workspace">
        <aside class="pages-panel">
          <div class="panel-title">PÁGINAS</div>
          <div id="pageList" class="page-list"></div>
          <button id="deletePageBtn" class="danger wide">Excluir página atual</button>
        </aside>
        <div class="canvas-area">
          <div id="loading" class="loading" hidden>Carregando PDF…</div>
          <canvas id="pdfCanvas"></canvas>
        </div>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
